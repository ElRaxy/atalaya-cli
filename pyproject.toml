[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atalaya-cli"
version = "0.1.0"
description = "Atalaya — tu vigía de ofertas dev remoto. AI-powered job aggregator CLI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Alex Mico", email = "raxytonto@gmail.com" }]
keywords = ["jobs", "scraper", "cli", "ai", "claude", "remote-work"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "anthropic>=0.40",
    "rich>=13",
    "pydantic>=2.7",
    "platformdirs>=4",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
bhound = "atalaya.cli:app"

[project.urls]
Homepage = "https://github.com/ElRaxy/atalaya-cli"
Repository = "https://github.com/ElRaxy/atalaya-cli"
Issues = "https://github.com/ElRaxy/atalaya-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["atalaya"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
